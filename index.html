<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tour 2027-2028</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <button id="menu-toggle" aria-label="Toggle menu">
        <svg class="icon-menu" viewBox="0 0 24 24" width="24" height="24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" width="24" height="24" style="display: none;">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
        </svg>
    </button>
    <div id="sidebar-overlay"></div>

    <div id="dashboard">
        <aside id="sidebar">
            <header>
                <h1>Tour du Monde</h1>
                <p class="subtitle">Une Aventure Globale</p>
                <div id="countdown">
                    <p>L'aventure commence dans :</p>
                    <div id="timer">--j --h --m</div>
                </div>
                <div id="budget-summary">
                    <p class="budget-title">Budget Estimé (1 pers.)</p>
                    <div class="budget-value">27.5k€ - 32.5k€</div>
                    <ul class="budget-details">
                        <li>✈️ Vols: 4k€ - 6k€</li>
                        <li>🏨 Vie: ~21.5k€ (60€/j)</li>
                        <li>🛡️ Autres: 1.5k€ (Visas, Assur.)</li>
                    </ul>
                </div>
            </header>
            <nav id="itinerary-list">
                <!-- Itinerary items will be injected here -->
            </nav>
            <footer id="sidebar-footer">
                <p>Dernière mise à jour : <span id="update-timestamp">--/--/---- --:--</span></p>
            </footer>
        </aside>
        <main id="map-container">
            <div id="map"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <script src="app.js"></script>
</body>
</html>
